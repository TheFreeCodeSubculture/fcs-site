# Builds and deploys the site to GitHub Pages.
#
# Runs on every push to master, every 30 minutes, and on demand. Each run
# first refreshes data/github.json (repositories and the latest commit)
# with this workflow's own token, so visitors never call the rate-limited
# GitHub API themselves, and events.ics, the calendar feed people
# subscribe to. The snapshot ships with the deployment; it is
# never committed, so the git history stays clean.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [master]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # satori and sharp draw the link-preview cards (tools/og.mjs).
      - name: Install build tools
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Snapshot GitHub data
        run: node tools/github-snapshot.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calendar feed
        run: node tools/events-feed.mjs

      - name: Blog pages and link-preview cards
        run: node tools/blog-build.mjs

      # Publish the frontend only. backend/ contains server source and
      # migrations, and must never be downloadable from GitHub Pages.
      - name: Stage frontend
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='backend' \
            --exclude='tools' \
            --exclude='docs' \
            --exclude='node_modules' \
            --exclude='_site' \
            --exclude='.github' \
            --exclude='.agents' \
            --exclude='.codex' \
            --exclude='.opencode' \
            --exclude='.impeccable' \
            --exclude='BACKEND-MIGRATION.md' \
            --exclude='YOUR-ACTION-ITEMS.md' \
            --exclude='README.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='skills-lock.json' \
            ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
