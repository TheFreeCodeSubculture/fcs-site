# Builds and deploys the site to GitHub Pages.
#
# Runs on every push to master and on demand. Each run rebuilds the static
# pieces: events.ics, the calendar feed people subscribe to, and the blog
# pages. Those are build output and are never committed, so the git history
# stays clean. GitHub repository data is served by the backend's cache and
# does not need a deploy.
#
# The admin panel starts this workflow through the backend's refresh-site
# route whenever it changes something the static build reads: a published
# blog post, an event or a class session. There is no polling schedule.
#
# Build and deploy are separate jobs on purpose: deploy-pages runs in a
# fresh job, so it cannot race the artifact upload (actions/deploy-pages#451).
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Forks may run tests, but only the canonical organisation repository
    # may publish the production site.
    if: github.repository == 'TheFreeCodeSubculture/fcs-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # satori and sharp draw the link-preview cards (tools/og.mjs).
      - name: Install build tools
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Calendar feed
        run: node tools/events-feed.mjs

      - name: Blog pages and link-preview cards
        run: node tools/blog-build.mjs

      # Publish the frontend only. backend/ contains server source and
      # migrations, and must never be downloadable from GitHub Pages.
      - name: Stage frontend
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='backend' \
            --exclude='tools' \
            --exclude='docs' \
            --exclude='node_modules' \
            --exclude='_site' \
            --exclude='.github' \
            --exclude='.agents' \
            --exclude='.codex' \
            --exclude='.opencode' \
            --exclude='.impeccable' \
            --exclude='README.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='skills-lock.json' \
            ./ _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.repository == 'TheFreeCodeSubculture/fcs-site'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
