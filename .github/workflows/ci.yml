name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fcs
          POSTGRES_PASSWORD: fcs
          POSTGRES_DB: fcs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fcs -d fcs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://fcs:fcs@127.0.0.1:5432/fcs_test
      TEST_DATABASE_URL: postgres://fcs:fcs@127.0.0.1:5432/fcs_test
      SITE_ORIGINS: http://localhost:8000
      PUBLIC_API_URL: http://localhost:5050
      MEDIA_DIR: ./media
      FCS_ENV_FILE: /tmp/fcs-ci-empty.env
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrations
        run: npm run db:migrate

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
