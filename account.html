<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://fcs-api.akos-archives.in; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex" />
  <script src="js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your profile | The Free Code Subculture</title>
  <meta name="description" content="Your The Free Code Subculture member profile." />
  <link rel="icon" type="image/svg+xml" href="assets/logoicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,700..800&family=Archivo+Mono&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <script src="js/page-transitions.js"></script>
</head>
<body class="profile-page-body">
  <canvas id="profile-pixel-field" class="profile-pixel-field" aria-hidden="true"></canvas>
  <nav class="doc-nav account-nav">
    <a href="./" class="nav-brand">
      <img src="assets/logoicon.svg" alt="" class="nav-brand-logo" width="24" height="22" />TFCS<span class="nav-brand-sub">/PROFILE</span>
    </a>
    <div class="account-nav-actions">
      <a class="account-back" href="./">Back to the RFC</a>
      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Switch to dark mode"
      >
        <span class="theme-toggle-icons" aria-hidden="true"><svg class="icon icon-moon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#i-moon"></use></svg><svg class="icon icon-sun" aria-hidden="true" focusable="false"><use href="assets/icons.svg#i-sun"></use></svg></span>
      </button>
    </div>
  </nav>

  <main class="profile-page" id="profile-root" aria-live="polite">
    <p class="profile-loading">Loading your profile…</p>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/config.js"></script>
  <script src="js/track.js" defer></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
